<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book | Julian Gigola</title>
<meta name="robots" content="noindex">
<!-- Link previews (iMessage, Instagram, WhatsApp): crawlers don't run the script below, so these stay the same for every path. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Julian Gigola">
<meta property="og:title" content="Book a session | Julian Gigola">
<meta property="og:description" content="Headshots, portraits, graduation and digitals in the Bay Area.">
<meta property="og:image" content="https://book.juliangigola.com/og-home.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://juliangigola.com/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@900&display=swap" rel="stylesheet">
<style>
  /* book.juliangigola.com: the Cal.com booker in the site's colors. One page; the path picks the event. */
  :root { --bg: #ebedef; --fg: #141211; --muted: #515354; --line: #d3d5d7; --accent: #007879; --card: #ebedef; --card-line: #d9dbdd; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b0a09; --fg: #f1f0ed; --muted: #92908d; --line: #21201f; --accent: #3ee6f0; --card: #141211; --card-line: #1e1c1b; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0b0a09; --fg: #f1f0ed; --muted: #92908d; --line: #21201f; --accent: #3ee6f0; --card: #141211; --card-line: #1e1c1b; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 13px/1.5 "IBM Plex Mono", monospace; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { margin-bottom: 40px; }
  header a { font: 900 clamp(24px, 3vw, 32px)/1 "Inter Tight", sans-serif; letter-spacing: -0.02em; color: var(--fg); text-decoration: none; }
  h1 { font: 900 clamp(56px, 9vw, 96px)/0.92 "Inter Tight", sans-serif; letter-spacing: -0.03em; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 32px; }
  #list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  #list a { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 20px 0; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; }
  #list b { font: 900 clamp(22px, 3vw, 32px)/1 "Inter Tight", sans-serif; letter-spacing: -0.02em; }
  #list span { color: var(--muted); align-self: center; }
  #list i { font-style: normal; color: var(--muted); grid-column: 1 / -1; }
  #list a:hover b { color: var(--accent, inherit); }
  header a { display: inline-flex; align-items: center; gap: 12px; }
  .logo { width: 48px; height: 48px; border-radius: 8px; }
  #photo, #who img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
  /* Phone: photo in the header. Tablet and up: photo and name on top of the calendar card. */
  #who { display: none; }
  @media (min-width: 768px) {
    #photo, header .logo { display: none; }
    #line { padding-bottom: 32px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    main #cal { border-top: 0; padding-top: 0; }
    #who { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; font: 900 18px/1 "Inter Tight", sans-serif; letter-spacing: -0.02em; }
  }
  #cal { border-top: 1px solid var(--line); padding-top: 24px; }
  /* Desktop: the row reads as the top of Cal's card (measured: 760px wide, centered, same fill and edge) and laps 10px over the card's top border and corners. Cal widens its card once the frame is 1024px (a 1080px window); below that it stays a plain row */
  @media (min-width: 1080px) {
    /* Fit on one laptop screen: the name and photo already sit on the calendar, so the top row goes, and the title runs on one line. */
    header { display: none; }
    main { padding-top: 40px; }
    h1 { font-size: 72px; }
    h1 br { display: none; }
    #line { padding-bottom: 20px; margin-bottom: 20px; }
    #who { box-sizing: border-box; max-width: 760px; margin: 0 auto -10px; padding: 24px 20px 16px; background: var(--card); border: 1px solid var(--card-line); border-bottom: 0; border-radius: 8px 8px 0 0; position: relative; z-index: 1; }
  }
  /* A call's wall behind it, as the site's booking pages have theirs: that discipline's photographs, tilted, blurred and veiled. Not on a phone, as there. */
  #wall { position: fixed; inset: 0; z-index: -1; overflow: hidden; perspective: 1200px; }
  #wall div { position: absolute; left: 50%; top: 50%; width: 2600px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 28px; transform: translate(-50%, -50%) rotateX(12deg) rotateZ(-6deg); filter: blur(5px); animation: drift 90s linear infinite alternate; }
  #wall img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 6px; }
  #wall::after { content: ""; position: absolute; inset: 0; background: color-mix(in oklab, var(--bg) 62%, transparent); }
  @keyframes drift { to { transform: translate(-50%, -44%) rotateX(12deg) rotateZ(-6deg); } }
  @media (prefers-reduced-motion: reduce) { #wall div { animation: none; } }
  @media (max-width: 639px) { #wall { display: none; } }
</style>
</head>
<body>
<main>
  <header><a href="https://juliangigola.com"><img class="logo" src="/logo.svg" alt="" width="48" height="48"><img id="photo" src="/julian.jpg" alt="" width="48" height="48">Julian Gigola</a></header>
  <h1 id="title"></h1>
  <p id="line"></p>
  <div id="who"><img class="logo" src="/logo.svg" alt="" width="48" height="48"><img src="/julian.jpg" alt="" width="48" height="48">Julian Gigola</div>
  <div id="cal"></div>
</main>
<script>
  (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");

  // slug on book.juliangigola.com = slug on cal.com/juliangigola
  const events = {
    headshots: ["Headshots", "Book headshots", "30 min Sessions • in Studio or on Location"],
    portraits: ["Portraits", "Book a portrait session", "60 min Sessions • in Studio, on Campus or at Your Place"],
    graduation: ["Graduation", "Book a graduation session", "90 min Sessions • on Campus"],
    digitals: ["Digitals", "Book digitals", "45 min Sessions • in Studio"],
    editorial: ["Editorial call", "Editorial call", "Fifteen minutes about the idea, the team and the dates. I quote after the call."],
    campaign: ["Brand call", "Brand & campaign call", "Fifteen minutes about the brief, deliverables, usage and dates. I quote after the call."],
  };
  // Each call's wall: its discipline's photographs on the site, through its image resizing.
  const walls = {"editorial":["/work/nova/06.jpg","/work/nova/08.jpg","/work/fauxtopia/05.jpg","/work/ghostlight/09.jpg","/work/ghostlight/08.jpg","/work/lithe/04.jpg","/work/threshold/03.jpg","/work/azure-bloom/02.jpg","/work/paranoia/01.jpg","/work/paranoia/08.jpg","/work/ravaged/01.jpg","/work/second-skin/01.jpg","/work/second-skin/08.jpg","/work/second-skin/17.jpg","/work/i-wanna-be-a-human/02.jpg","/work/i-wanna-be-a-human/14.jpg","/work/novocaine/06.jpg","/work/novocaine/08.jpg","/work/relay/01.jpg","/work/undisputed/01.jpg","/work/undisputed/10.jpg","/work/decoy/06.jpg","/work/nyx/07.jpg","/work/void/01.jpg","/work/aegis/03.jpg","/work/vigil/01.jpg","/work/astral-allure/04.jpg","/work/astral-allure/03.jpg","/work/lost-relic/06.jpg","/work/byte-me/05.jpg","/work/byte-me/12.jpg","/work/coral-synthmorph/05.jpg","/work/dark-matter/06.jpg","/work/entangled/02.jpg","/work/entangled/09.jpg","/work/frostbite/06.jpg","/work/isabela/02.jpg","/work/light-play/03.jpg","/work/lightbeam/02.jpg","/work/liquid-metal-dreams/06.jpg","/work/luxe-meets-future/08.jpg","/work/luxe-meets-future/20.jpg","/work/poise/08.jpg","/work/purgatory/09.jpg","/work/retro-reverie-vol-01/01.jpg","/work/retro-reverie-vol-01/08.jpg","/work/retro-reverie-vol-02/08.jpg","/work/steampunk-files-001/11.jpg"],"campaign":["/work/paradox/01.jpg","/work/paradox/04.jpg","/work/paradox/07.jpg","/work/paradox/10.jpg","/work/ukiyosunknown/01.jpg","/work/ukiyosunknown/06.jpg","/work/ukiyosunknown/13.jpg","/work/ukiyosunknown/18.jpg","/work/ukiyosunknown/21.jpg","/work/sago/02.jpg","/work/sago/05.jpg","/work/sago/08.jpg","/work/sago/11.jpg","/work/diesel/03.jpg","/work/diesel/04.jpg","/work/diesel/07.jpg","/work/wired-magazine/03.jpg","/work/wired-magazine/06.jpg","/work/wired-magazine/09.jpg","/work/wired-magazine/12.jpg","/work/wired-magazine/15.jpg","/work/wired-magazine/18.jpg","/work/goodcult/03.jpg","/work/goodcult/06.jpg","/work/goodcult/09.jpg","/work/goodcult/12.jpg","/work/goodcult/15.jpg","/work/jubo/03.jpg","/work/jubo/04.jpg","/work/nabu/59.jpg","/work/nabu/17.jpg","/work/nabu/29.jpg","/work/nabu/79.jpg","/work/oakley-x-nike/01.jpg","/work/oakley-x-nike/04.jpg","/work/hua/16.jpg","/work/hua/15.jpg","/work/hua/02.jpg","/work/hua/04.jpg","/work/kala-x-sharks/06.jpg","/work/kala-x-sharks/03.jpg","/work/kala-x-sharks/07.jpg","/work/sols/02.jpg","/work/sols/05.jpg","/work/the-den-talkshow/01.jpg","/work/the-den-talkshow/04.jpg","/work/the-den-talkshow/07.jpg","/work/hellamack/03.jpg"]};
  const length = { headshots: "30 min", portraits: "60 min", graduation: "90 min", digitals: "45 min", editorial: "15 min call", campaign: "15 min call" };
  const slug = location.pathname.split("/")[1];
  const $ = (id) => document.getElementById(id);

  if (!(slug in events)) {
    // book.juliangigola.com/ (or any unknown path): pick a booking type.
    document.title = "Book | Julian Gigola";
    $("title").textContent = "Book a session";
    $("line").textContent = "Pick one. The times are live from my calendar.";
    $("who").remove();
    $("cal").outerHTML = `<ul id="list">${Object.entries(events)
      .map(([s, [t, , l]]) => `<li><a href="/${s}"><b>${t}</b><span>${length[s]}</span><i>${l}</i></a></li>`).join("")}</ul>`;
  } else {
  const [name, title, line] = events[slug];
  document.title = title + " | Julian Gigola";
  $("title").innerHTML = "Book <br>" + name;
  $("line").textContent = line;
  if (walls[slug] && matchMedia("(min-width: 640px)").matches)
    document.body.insertAdjacentHTML("afterbegin", `<div id="wall" aria-hidden="true"><div>${walls[slug]
      .map((src) => `<img src="https://juliangigola.com/cdn-cgi/image/width=320,quality=70,format=auto${src}" alt="" decoding="async">`).join("")}</div></div>`);
  // Sessions (not the calls) take a deposit; collected by hand until Stripe is connected in Cal.com.
  if (!/call$/.test(name)) $("line").insertAdjacentHTML("beforeend", " • Deposit required to confirm booking");

  Cal("init", { origin: "https://app.cal.com" });
  Cal("inline", { elementOrSelector: "#cal", calLink: "juliangigola/" + slug, config: { theme: "auto", layout: "month_view" } });
  Cal("ui", {
    theme: "auto",
    // Cal's own panel (small round avatar, title, description) moves to the page: photo in the header, title and line above.
    hideEventTypeDetails: true,
    layout: "month_view",
    cssVarsPerTheme: {
      light: {
        "cal-brand": "#007879", "cal-brand-emphasis": "#141211", "cal-brand-text": "#ebedef",
        "cal-bg": "#ebedef", "cal-bg-muted": "#e1e3e5", "cal-bg-subtle": "#e1e3e5", "cal-bg-emphasis": "#d3d5d7",
        "cal-text": "#141211", "cal-text-emphasis": "#141211", "cal-text-subtle": "#515354", "cal-text-muted": "#515354",
        "cal-border": "#d3d5d7", "cal-border-subtle": "#d7d9db", "cal-border-emphasis": "#141211", "cal-border-booker": "#d3d5d7",
      },
      dark: {
        "cal-brand": "#3ee6f0", "cal-brand-emphasis": "#f1f0ed", "cal-brand-text": "#0b0a09",
        "cal-bg": "#0b0a09", "cal-bg-muted": "#141211", "cal-bg-subtle": "#141211", "cal-bg-emphasis": "#21201f",
        "cal-text": "#f1f0ed", "cal-text-emphasis": "#f1f0ed", "cal-text-subtle": "#92908d", "cal-text-muted": "#92908d",
        "cal-border": "#21201f", "cal-border-subtle": "#1f1e1d", "cal-border-emphasis": "#f1f0ed", "cal-border-booker": "#21201f",
      },
    },
  });
  }
</script>
</body>
</html>
