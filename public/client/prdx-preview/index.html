<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noimageindex">
<title>PARADOX02 Preview</title>
<style>
@font-face{font-family:"Inter Tight";src:url(fonts/InterTight-Variable.woff2) format("woff2");font-weight:500 900;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/IBMPlexMono-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/IBMPlexMono-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{--bg:#0a0a0b;--fg:#ecebee;--mute:#7d7b82;--line:#1e1d21;--accent:#a99cf0;--btn:#ecebee;--btnfg:#0a0a0b}
:root[data-theme="dark"]{--bg:#0a0a0b}
@media (prefers-color-scheme: light){:root:not([data-theme="light"]){--bg:#0a0a0b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 "IBM Plex Mono",ui-monospace,Consolas,monospace;padding-bottom:env(safe-area-inset-bottom)}
.mono{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
header{max-width:1600px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 16px 40px;display:grid;gap:28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.wm{font:900 20px/1 "Inter Tight","Helvetica Neue",Arial,sans-serif;letter-spacing:-.045em;color:var(--fg);text-decoration:none}
.wm.big{display:block;font-size:clamp(48px,13vw,200px);line-height:.8;letter-spacing:-.055em}
h1{margin:0;font:900 clamp(56px,15vw,220px)/.8 "Inter Tight","Helvetica Neue",Arial,sans-serif;letter-spacing:-.055em;text-transform:uppercase}
.sub{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.sub p{margin:0;max-width:44ch;color:var(--mute)}
.grid{--h:260px;max-width:1600px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:6px}
.grid::after{content:"";flex:999 1 0}
@media (min-width:720px){.grid{--h:440px;gap:8px}}
.c{flex:var(--ar) 1 calc(var(--ar) * var(--h));position:relative;cursor:zoom-in;background:var(--line)}
.c img{width:100%;height:auto}
.c{container-type:inline-size;overflow:hidden}
.wmk{position:relative;display:inline-block;max-width:100%;max-height:100%}
.c img{display:block;opacity:0;transition:opacity .5s}
.c img.in{opacity:1}
.c .n{position:absolute;left:8px;bottom:6px;font-size:11px;color:#fff;letter-spacing:.08em;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.c.on{outline:2px solid var(--accent);outline-offset:-2px}
.h{position:absolute;right:0;top:0;width:48px;height:48px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.h svg{width:22px;height:22px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.h path,.lh path{fill:none;stroke:#fff;stroke-width:1.8}
.on .h path,.lb.on .lh path{fill:var(--accent);stroke:var(--accent)}
footer{max-width:1600px;margin:0 auto;padding:96px 16px max(24px,env(safe-area-inset-bottom));display:grid;gap:24px}
.fl{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--mute);text-decoration:none}footer a:hover{color:var(--fg)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,11,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:5}
.bar .cnt{flex:1}.bar .cnt b{color:var(--fg);font-weight:500}
.send{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;background:var(--btn);color:var(--btnfg);border:0;padding:12px 18px;cursor:pointer}
.send:disabled{opacity:.25;cursor:default}
.lb{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column}
.lb.open{display:flex}
.lb .img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.lb img{display:block;max-width:100vw;max-height:calc(100vh - 70px);object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb .t{display:flex;align-items:center;justify-content:center;padding:14px 8px calc(10px + env(safe-area-inset-bottom))}
.lb button{font:inherit;color:var(--fg);background:none;border:0;padding:12px 14px;cursor:pointer}
.lh{display:flex;align-items:center;gap:8px}.lh svg{width:22px;height:22px}
.ar{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:72px;height:96px;display:grid;place-items:center;padding:0!important}
.ar svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.6;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
#pv{left:max(4px,env(safe-area-inset-left))}#nx{right:max(4px,env(safe-area-inset-right))}
.ar:hover svg{stroke-width:2.2}
.x{position:absolute;z-index:2;top:calc(6px + env(safe-area-inset-top));right:6px;font-size:22px!important;line-height:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .box{background:var(--bg);border-top:1px solid var(--line);width:100%;max-width:520px;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet p{margin:0 0 16px}.sheet .list{color:var(--accent);word-break:break-word}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row button,.sheet .row a{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;text-align:center;flex:1;min-width:140px;padding:12px;border:1px solid var(--line);color:var(--fg);background:none;cursor:pointer}
.sheet .row .pri{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.done{color:var(--mute);margin-top:12px;min-height:1.5em}
@media (prefers-reduced-motion:reduce){.c img{transition:none}}
</style></head><body>
<header>
<div class="top"><a class="wm" href="https://juliangigola.com">Julian Gigola</a><span class="mono">Sneak peek</span></div>
<h1>PARADOX02</h1>
<div class="sub"><span class="mono">74 frames</span></div>
</header>
<main class="grid" id="g"></main>
<footer><a class="wm big" href="https://juliangigola.com">Julian Gigola</a><div class="fl mono"><span>Preview images. Finals come clean and full size.</span><a href="mailto:hello@juliangigola.com">hello@juliangigola.com</a></div></footer>
<div class="lb" id="lb"><button class="x" id="x" aria-label="Close">&times;</button>
<div class="img" id="li"><span class="wmk"><img id="lim" alt=""></span></div>
<button class="ar" id="pv" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button><button class="ar" id="nx" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
<div class="t mono"><span id="ln"></span></div></div>
<script>
const M=[[[1,"467/700"],[2,"467/700"],[3,"467/700"]],[[4,"467/700"],[11,"467/700"],[12,"467/700"],[13,"467/700"]],[[5,"467/700"],[6,"467/700"],[7,"467/700"],[8,"467/700"],[9,"467/700"],[10,"467/700"]],[[14,"467/700"],[15,"467/700"]],[[16,"467/700"],[17,"467/700"],[18,"467/700"]],[[19,"467/700"],[20,"467/700"]],[[21,"467/700"],[22,"467/700"],[23,"467/700"]],[[24,"467/700"],[25,"467/700"],[26,"467/700"],[27,"467/700"]],[[28,"467/700"],[29,"467/700"],[30,"467/700"]],[[31,"467/700"],[32,"467/700"],[33,"467/700"],[34,"467/700"]],[[35,"467/700"],[36,"467/700"],[37,"467/700"],[38,"467/700"]],[[39,"467/700"],[40,"467/700"],[41,"467/700"],[42,"467/700"]],[[43,"467/700"],[44,"467/700"],[45,"467/700"],[46,"467/700"]],[[47,"467/700"],[48,"467/700"],[49,"467/700"],[50,"467/700"]],[[51,"467/700"],[52,"467/700"],[53,"467/700"],[54,"467/700"]],[[55,"467/700"],[56,"467/700"],[57,"467/700"],[58,"467/700"]],[[59,"467/700"],[60,"467/700"],[61,"467/700"],[62,"467/700"]],[[63,"467/700"],[64,"467/700"],[65,"467/700"],[66,"467/700"]],[[67,"467/700"],[68,"467/700"],[69,"467/700"]],[[70,"467/700"],[71,"467/700"],[72,"467/700"],[73,"467/700"],[74,"467/700"]]],R=M.flat(),N=R.length;
const pad=n=>String(n).padStart(2,'0'),$=id=>document.getElementById(id);
const seq=R.map(r=>r[0]);
$('g').innerHTML=R.map(([n,r])=>{const [w,h]=r.split('/');return `<div class="c" data-n="${n}" style="--ar:${(w/h).toFixed(4)};aspect-ratio:${r}"><img src="t/${pad(n)}.jpg" loading="lazy" alt="PARADOX02 frame ${n}" onload="this.classList.add('in')" style="aspect-ratio:${r}"></div>`}).join('');
let cur=0;
function show(k){cur=((k%N)+N)%N;const n=seq[cur];$('lim').src=`i/${pad(n)}.jpg`;$('ln').textContent=`${cur+1} / ${N}`;$('lb').classList.add('open');
 [seq[(cur+1)%N],seq[(cur-1+N)%N]].forEach(m=>{new Image().src=`i/${pad(m)}.jpg`})}
function close(){$('lb').classList.remove('open')}
$('g').addEventListener('click',e=>{const c=e.target.closest('.c');if(c)show(seq.indexOf(+c.dataset.n))});
$('x').onclick=close;$('pv').onclick=()=>show(cur-1);$('nx').onclick=()=>show(cur+1);
let sx=null;$('li').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('li').addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1))});
document.addEventListener('keydown',e=>{if(!$('lb').classList.contains('open'))return;if(e.key==='Escape')close();else if(e.key==='ArrowRight')show(cur+1);else if(e.key==='ArrowLeft')show(cur-1)});
</script></body></html>
