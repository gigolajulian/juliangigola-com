<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email signature</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #f1f1f1; color: #202124; font: 14px/1.5 system-ui, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; }
  .panes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin: 16px 0; }
  /* Gmail's own light and dark reading panes. The signature sets no
     background and no colour on the name, so it takes the reader's. */
  .pane { padding: 28px; border-radius: 12px; }
  .light { background: #ffffff; color: #202124; }
  .dark { background: #1f1f1f; color: #e8eaed; }
  .pane small { display: block; margin-bottom: 18px; opacity: .6; }
  button { font: inherit; padding: 8px 16px; border-radius: 999px; border: 1px solid #202124; background: #202124; color: #fff; cursor: pointer; }
  ol { padding-left: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <button id="copy">Copy signature</button> <span id="done"></span>
  <div class="panes">
    <div class="pane light"><small>Light mode</small><div class="sig"></div></div>
    <div class="pane dark"><small>Dark mode</small><div class="sig"></div></div>
  </div>
  <ol>
    <li>Press <b>Copy signature</b>.</li>
    <li>Gmail on hello@ &rarr; Settings &rarr; See all settings &rarr; General &rarr; Signature &rarr; Create new.</li>
    <li>Paste, set it as the default for new emails and replies, Save changes.</li>
  </ol>
</div>

<!-- The signature itself. Rules that keep it right in both modes:
     no background anywhere; the name (Inter Tight Black, -0.04em) and the
     contact lines (IBM Plex Mono, caps, 0.08em) are public/email-*.png in
     the links' grey, since Gmail loads no web fonts; each has its words
     as alt text; the link line is a mid grey that reads on white and on
     Gmail's #1f1f1f, set inline or Gmail paints it blue. -->
<template id="signature">
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:'IBM Plex Mono',Menlo,Consolas,'Courier New',monospace;font-size:12px;line-height:18px;">

  </tr>
</table>
</template>
