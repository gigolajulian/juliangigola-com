# Every pull request and every push to main: the two suites the commit
# gate runs (`backend`, `frontend`). The perf suite in WebKit (frame
# timing, image weight, swipes and notches landing, `tests/perf/budgets.json`)
# is for an overhaul only, so it runs by hand: Actions > CI > Run workflow
# (Julian, 2026-10-12: no speed or image checks on a normal PR).
#
# Checks only. Deploying is Cloudflare Workers Builds' job (README,
# "Hosting"), and nothing here holds a token or a secret.
#
# The perf job is on macOS, for WebKit in a real window: headless WebKit
# draws this site at a few frames a second, and Safari is most of the
# audience. A hosted runner is a shared VM with no GPU of its own, so its
# frame numbers run slower than a Mac on a desk: they are printed here for
# comparing one run with the last, and judged by `npm run perf` on a Mac.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: no job writes to the repo (BASELINE.md REL-7).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two suites the commit gate runs (`scripts/test/gate.mjs`), so a pull
  # request shows them too: request-level checks of the API routes, the
  # contact action and the book Worker, then the site at six ratios in
  # Chromium and Firefox. No secrets: every binding is a fake or absent.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test/gate.mjs --backend

  # The component tests (tests/components, jsdom). Too slow for the commit
  # hook (about 5 minutes), so they run here on every pull request.
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --project components

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # A placeholder, not a key: the paid sessions keep the site's picker
    # only where the build has one (time-picker.tsx), as live does.
    env:
      NEXT_PUBLIC_STRIPE_PK: pk_test_ci_placeholder
      UI: ${{ github.event_name != 'push' && github.base_ref != 'main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browsers and the browser half run once per change, on its pull
      # request into next. The next-to-main pull request and the push to main
      # are code that already passed them (Julian, 2026-11-04). Hand runs keep them.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.UI == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox
        if: env.UI == 'true'
      - run: node scripts/test/gate.mjs --frontend
      # The browser half, which the commit hook leaves to CI.
      - run: node scripts/perf/run.mjs --ui --rebuild
        if: env.UI == 'true'
      - name: Frontend results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-results
          path: test-results/
          if-no-files-found: ignore

  checks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `PageProps` and `LayoutProps` are generated by Next, not checked in:
      # `next typegen` writes them, as `next build` would.
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The local flavour of the production build (`JG_LOCAL=1`,
      # `next.config.ts`), so the perf suite below reuses it rather than
      # building twice. It differs from a Cloudflare build only in one
      # rewrite and two headers.
      - name: Build
        run: npm run build
        env:
          JG_LOCAL: "1"

      # WebKit only: Safari's engine, and most of the audience. All three
      # browsers run on a Mac with `npm run perf`; here they took over 40
      # minutes, too long for a check on every pull request.
      - name: Install browsers
        run: npx playwright install webkit

      # Frames are reported, not judged, on a runner (`swipe.spec.ts`).
      - name: Perf suite
        run: npm run perf -- --project=webkit
        env:
          PERF_FRAMES: report

      - name: Perf results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: test-results/
          if-no-files-found: ignore
