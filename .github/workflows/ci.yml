# Every pull request and every push to main: the two suites the commit
# gate runs (`backend`, `frontend`). The perf suite in WebKit (frame
# timing, image weight, swipes and notches landing, `tests/perf/budgets.json`)
# is for an overhaul only, so it runs by hand: Actions > CI > Run workflow
# (Julian, 2026-10-12: no speed or image checks on a normal PR).
#
# Checks only. Deploying is Cloudflare Workers Builds' job (README,
# "Hosting"), and nothing here holds a token or a secret.
#
# The perf job is on macOS, for WebKit in a real window: headless WebKit
# draws this site at a few frames a second, and Safari is most of the
# audience. A hosted runner is a shared VM with no GPU of its own, so its
# frame numbers run slower than a Mac on a desk: they are printed here for
# comparing one run with the last, and judged by `npm run perf` on a Mac.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two suites the commit gate runs (`scripts/test/gate.mjs`), so a pull
  # request shows them too: request-level checks of the API routes, the
  # contact action and the book Worker, then the site at six ratios in
  # Chromium and Firefox. No secrets: every binding is a fake or absent.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test/gate.mjs --backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: node scripts/test/gate.mjs --frontend
      # The browser half, which the commit hook leaves to CI.
      - run: node scripts/perf/run.mjs --ui --rebuild
      - name: Frontend results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-results
          path: test-results/
          if-no-files-found: ignore

  checks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `PageProps` and `LayoutProps` are generated by Next, not checked in:
      # `next typegen` writes them, as `next build` would.
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The local flavour of the production build (`JG_LOCAL=1`,
      # `next.config.ts`), so the perf suite below reuses it rather than
      # building twice. It differs from a Cloudflare build only in one
      # rewrite and two headers.
      - name: Build
        run: npm run build
        env:
          JG_LOCAL: "1"

      # WebKit only: Safari's engine, and most of the audience. All three
      # browsers run on a Mac with `npm run perf`; here they took over 40
      # minutes, too long for a check on every pull request.
      - name: Install browsers
        run: npx playwright install webkit

      # Frames and the splash's timing are reported, not judged, on a
      # runner (`swipe.spec.ts`, `splash.spec.ts`).
      - name: Perf suite
        run: npm run perf -- --project=webkit
        env:
          PERF_FRAMES: report

      - name: Perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: test-results/
          if-no-files-found: ignore
