# Checks on every pull request and every push to main: types, lint, a
# production build, and the perf suite in WebKit: layout, image weight,
# and swipes and notches landing (`tests/perf/budgets.json`).
#
# Checks only. Deploying is Cloudflare Workers Builds' job (README,
# "Hosting"), and nothing here holds a token or a secret.
#
# macOS, for WebKit in a real window: headless WebKit draws this site at a
# few frames a second, and Safari is most of the audience. A hosted runner
# is a shared VM with no GPU of its own, so its frame numbers run slower
# than a Mac on a desk: they are printed here for comparing one run with
# the last, and judged against the budgets by `npm run perf` on a Mac.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `PageProps` and `LayoutProps` are generated by Next, not checked in:
      # `next typegen` writes them, as `next build` would.
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The local flavour of the production build (`JG_LOCAL=1`,
      # `next.config.ts`), so the perf suite below reuses it rather than
      # building twice. It differs from a Cloudflare build only in one
      # rewrite and two headers.
      - name: Build
        run: npm run build
        env:
          JG_LOCAL: "1"

      # WebKit only: Safari's engine, and most of the audience. All three
      # browsers run on a Mac with `npm run perf`; here they took over 40
      # minutes, too long for a check on every pull request.
      - name: Install browsers
        run: npx playwright install webkit

      # Frames are reported, not judged, on a runner (`swipe.spec.ts`).
      - name: Perf suite
        run: npm run perf -- --project=webkit
        env:
          PERF_FRAMES: report

      - name: Perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: test-results/
          if-no-files-found: ignore
