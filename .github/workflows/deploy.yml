name: Deploy to Cloudflare Workers

# The production deploy. Pushing to `main` ships the site — including a push
# made by `/admin`, which commits `content/site.json` through the GitHub API
# and relies on this running afterwards.
#
# Note what is NOT here any more: the old Pages workflow ran
# `cp app/contact/actions.static.ts app/contact/actions.ts` before building,
# destroying the real Server Action because a static host could not run it.
# That is why the contact form has never sent an email. On a Worker it runs,
# so nothing overwrites it. `actions.static.ts` stays in the tree as the
# documented fallback, unused.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A deploy is a mutation of one live site, so two of them must not interleave.
# Queue rather than cancel: cancelling mid-upload can leave the asset set
# half-replaced.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and deploy
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Baked into the bundle at build time, so they are build env rather
          # than Worker vars. Neither is a secret: one is a flag, the other a
          # public image hostname.
          NEXT_PUBLIC_IMAGE_CDN: "1"
          NEXT_PUBLIC_IMAGE_ORIGIN: https://images.juliangigola.com

      # The archive is not in the repo, so it is not in this checkout and is
      # not touched by a deploy. It is pushed from a workstation after a
      # harvest: `node scripts/sync-r2.mjs`.
